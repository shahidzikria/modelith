name: ci

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p packages/blocks
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: '1'

  python-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx tsx tests/generate-fixtures.ts --no-pretrained
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchvision==0.23.0
      - run: pip install timm==1.0.30 scipy onnx torchmetrics pycocotools pytest fastapi httpx
      # Every template: smoke test, UI shape/param check, 2 training steps, ONNX export.
      - run: python -m pytest tests/python -q
      - run: python -m pytest apps/verify -q
